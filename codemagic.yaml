workflows:
  ios-testflight:
    name: "Bloop Pop iOS"
    max_build_duration: 60
    instance_type: mac_mini_m2

    # App Store Connect integration name configured in Codemagic Team Settings
    integrations:
      app_store_connect: codeteam

    environment:
      flutter: stable
      # Using 'latest' ensures compatibility with current Xcode tools while supporting iOS 14+ / Apple Duo
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.rayo.blooppop
      ios_signing:
        # Profile & certificate names saved under Codemagic Team settings > Code signing identities
        provisioning_profiles:
          - BloopProf
        certificates:
          - Rayo

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Run Flutter tests
        script: flutter test

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build signed Flutter IPA
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 2))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - rayo.trans09@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Set submit_to_app_store: true when ready for App Store review

  android-release:
    name: "Bloop Pop Android"
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: com.rayo.blooppop

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Run Flutter tests
        script: flutter test

      - name: Build Android App Bundle (AAB) & APK
        script: |
          BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 2))
          flutter build appbundle --release --build-name=1.0.0 --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name=1.0.0 --build-number="$BUILD_NUMBER"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - rayo.trans09@gmail.com
        notify:
          success: true
          failure: true

